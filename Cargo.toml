[package]
name = "humangl"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
log = "0.4"
pretty_env_logger = "0.5.0"
thiserror = "1"
tobj = { version = "3", features = ["log"] }
vulkanalia = { version = "=0.35.0", features = ["libloading", "provisional", "window"] }
winit = { version = "0.30", features = ["x11", "wayland"] }
rfd = "0.17.2"
imgui = "0.12.0"
imgui-winit-support = "0.13.0"
